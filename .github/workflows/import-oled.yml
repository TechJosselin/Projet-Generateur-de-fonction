name: Import OLED 3-line project
on:
  push:
    branches:
      - feature/menu-oled-3-lignes
permissions:
  contents: write
jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source files from uploaded project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import lzma
          import shutil
          import tarfile

          pieces = sorted(Path(".project-import").glob("part*.b64"))
          assert len(pieces) == 5, f"Expected 5 parts, got {len(pieces)}"
          archive = base64.b64decode("".join(p.read_text() for p in pieces), validate=True)
          assert hashlib.sha256(archive).hexdigest() == "0cc1b066b483a870fb248d7560b90ea04aa41e4329c0c79fda84ec9dc91def0d"

          destination = Path("EQ1_Projet_Generateur_Fonction")
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive)), mode="r:") as tar:
              members = tar.getmembers()
              for entry in members:
                  p = Path(entry.name)
                  assert entry.isfile() and not p.is_absolute() and ".." not in p.parts
              if destination.exists():
                  shutil.rmtree(destination)
              destination.mkdir(parents=True, exist_ok=True)
              for entry in members:
                  p = destination / entry.name
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(tar.extractfile(entry).read())
          shutil.rmtree(".project-import")
          Path(".github/workflows/import-oled.yml").unlink()
          print(f"Restored {len(members)} source files")
          PY
      - name: Commit restored PlatformIO project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import PlatformIO source with OLED 3-line menu"
          git push origin HEAD:feature/menu-oled-3-lignes
