name: Firmware and native tests

on:
  push:
    branches: [main, integration/full-system, 'finalisation/**']
    paths:
      - 'EQ1_Projet_Generateur_Fonction/**'
      - 'tools/**'
      - 'requirements-build.txt'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'EQ1_Projet_Generateur_Fonction/**'
      - 'tools/**'
      - 'requirements-build.txt'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (ASan and UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - name: Compile and run native tests
        run: python tools/run_native_tests.py --sanitize
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ github.sha }}
          path: |
            build/native/tests.log
            build/native/results.json
          retention-days: 14
          if-no-files-found: warn

  firmware:
    name: ESP32-C6 build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
      - name: Install PlatformIO Core
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python -m pip install -r requirements-build.txt 2>&1 | tee build/install.log
      - name: Record environment
        shell: bash
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            python --version
            python -m platformio --version
            python -m pip freeze
            cat EQ1_Projet_Generateur_Fonction/platformio.ini
          } 2>&1 | tee build/environment.log
      - name: Compile firmware
        shell: bash
        run: |
          set -o pipefail
          python -m platformio run -d EQ1_Projet_Generateur_Fonction -e seeed_xiao_esp32c6 2>&1 | tee build/firmware.log
      - name: Record resolved packages
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python -m platformio pkg list -d EQ1_Projet_Generateur_Fonction 2>&1 | tee build/packages.log
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32c6-${{ github.sha }}
          path: |
            build/*.log
            EQ1_Projet_Generateur_Fonction/.pio/build/seeed_xiao_esp32c6/firmware.*
            EQ1_Projet_Generateur_Fonction/.pio/build/seeed_xiao_esp32c6/bootloader.bin
            EQ1_Projet_Generateur_Fonction/.pio/build/seeed_xiao_esp32c6/partitions.bin
            EQ1_Projet_Generateur_Fonction/.pio/build/seeed_xiao_esp32c6/project_description.json
            EQ1_Projet_Generateur_Fonction/dependencies.lock
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
