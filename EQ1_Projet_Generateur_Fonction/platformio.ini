; Generateur de fonctions - environnement de reference P01.
; Versions relevees sur le build CI reussi 40871626330 (29 octobre 2026).
; Voir docs/P01_SUIVI.md a la racine pour les preuves et limites de validation.
; PlatformIO Core est fixe dans requirements-build.txt.

[env:seeed_xiao_esp32c6]
platform = platformio/espressif32@8.0.0
board = seeed_xiao_esp32c6
framework = espidf

; Versions exactes : ne pas laisser les plages ~ ou ^ du manifeste evoluer.
; Le numero du paquet framework 4.60100.0 correspond a ESP-IDF 6.1.0.
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-riscv32-esp@15.2.0+20251204
    platformio/toolchain-esp32ulp@1.23800.240113
    platformio/tool-cmake@3.30.2
    platformio/tool-ninja@1.7.1
    platformio/tool-esptool@2.50400.0
    platformio/tool-esp-rom-elfs@0.0.1+20241011
    espressif/tool-riscv32-esp-elf-gdb@12.1.0+20221002
    espressif/tool-xtensa-esp-elf-gdb@12.1.0+20221002

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
